# Обычный запуск: docker compose up --build -d (приложение + PostgreSQL)
# S3/MinIO включается отдельно: docker compose --profile s3 up --build -d
# Только инфраструктура для npm run dev на хосте: docker compose up -d postgres
services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      # Внутри Docker по умолчанию используем локальное приватное хранилище тома app_storage.
      # Для S3 задайте STORAGE_DRIVER=s3 перед запуском compose.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/.storage
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: setka
      S3_FORCE_PATH_STYLE: "1"
      S3_PRESIGN_TTL: "60"
      INSECURE_COOKIE: "1"
    command: ["sh", "-c", "npx drizzle-kit push && npm run start"]
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/.storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое приватное хранилище. Не участвует в обычном запуске,
  # чтобы проблемы реестра образов не блокировали приложение и PostgreSQL.
  # Образ берём с официального Quay: на Docker Hub репозитории MinIO больше
  # не публикуются (minio/mc:latest отвечает "not found"). Отдельный mc-init
  # не нужен: приложение само создаёт приватный бакет при первой загрузке.
  minio:
    profiles: ["s3"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
  app_storage:
